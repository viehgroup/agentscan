name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # 24.04 still ships Python 3.9; ubuntu-latest (26.04) does not
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  action:
    # Run the action itself against the deliberately broken demo project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./
        with:
          path: examples/demo
          fail-on: never
          sarif: agentscan.sarif
      - name: Check the report
        run: |
          python3 - <<'PY'
          import json
          results = json.load(open("agentscan.sarif"))["runs"][0]["results"]
          ids = {r["ruleId"] for r in results}
          print(len(results), "findings:", sorted(ids))
          assert {"AS002", "AS003", "AS004", "AS010"} <= ids
          PY
